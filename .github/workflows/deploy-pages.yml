name: Deploy public overview to GitHub Pages

# Public-facing read-only overview of Korynth Labs.
# The full operational dashboard (with API routes, SSE, email send)
# is still run locally via `cd website && npm run dev`.
#
# This workflow:
#   1. Builds the Next.js app in static-export mode (BUILD_TARGET=pages).
#   2. Bakes in the current .firm/state.json + roster + ledger as build-time data.
#   3. Publishes the resulting /out as a GitHub Pages site.
#
# Public URL after first successful run: https://beko2210.github.io/the_firm/

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.firm/state.json'
      - '.firm/employees/_roster.yaml'
      - 'finance/ledger.jsonl'
      - 'okrs/**'
      - 'ai-ethics/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Cancel an in-progress deploy if a new push lands.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install dependencies
        working-directory: website
        run: npm ci || npm install

      # Static export does not support API routes. Move them aside for the build,
      # then restore them so the repo state stays intact for local dev (`npm run dev`).
      - name: Stash dynamic API routes
        run: |
          if [ -d website/app/api ]; then
            mv website/app/api /tmp/korynth-api-stash
            echo "stashed=true" >> "$GITHUB_OUTPUT"
          fi
        id: stash

      - name: Build (static export for GitHub Pages)
        working-directory: website
        env:
          BUILD_TARGET: pages
          NEXT_PUBLIC_BASE_PATH: /the_firm
          NODE_ENV: production
        run: npm run build

      - name: Restore stashed API routes
        if: always() && steps.stash.outputs.stashed == 'true'
        run: mv /tmp/korynth-api-stash website/app/api

      - name: Ensure .nojekyll is present
        run: touch website/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
