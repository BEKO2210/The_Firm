# Compliance overlays (industry-specific, on top of meta DSGVO)
compliance_overlays:
  active:
    - id: "DSGVO"
      name: "EU GDPR / Datenschutz-Grundverordnung"
      mandatory: true
      reason: "Region = Germany; data subjects in EEA"
      docs_required: ["VVT (Art. 30)", "DPIA where applicable (Art. 35)", "AVV (Art. 28)", "Breach notification 72h (Art. 33)"]
    - id: "EU-AI-Act"
      name: "Regulation (EU) 2024/1689 — Artificial Intelligence Act"
      mandatory: true
      reason: "Industry = AI-Native SaaS"
      docs_required: ["AI risk classification per product", "Transparency disclosures", "Bias audits"]
    - id: "SOC-2-Type-II"
      name: "SOC 2 Type II — Trust Services Criteria"
      mandatory: false
      reason: "Premium B2B SaaS trust signal"
      docs_required: ["Annual audit", "Change management", "Access controls"]
    - id: "ISO-27001"
      name: "ISO/IEC 27001 — Information Security Management"
      mandatory: false
      reason: "Premium B2B SaaS InfoSec signal"
      docs_required: ["ISMS", "Risk register", "Annual audit"]
    - id: "DSGVO-AVV"
      name: "Auftragsverarbeitungsvertrag (Art. 28 DSGVO)"
      mandatory: true
      reason: "Any sub-processor (Anthropic, Vercel, etc.) requires AVV"
      docs_required: ["AVV per vendor", "Subprocessor list"]

# Tech-stack defaults (used in pool/tools.yaml seeds + new-project templates)
tech_stack_defaults:
  backend:
    primary: ["TypeScript (Node 22+, Bun, Deno)", "Python 3.13", "Go 1.23"]
    frameworks: ["Hono", "FastAPI", "tRPC", "Drizzle ORM"]
  frontend:
    primary: ["Next.js 15", "React 19", "TypeScript"]
    libs: ["Tailwind CSS 4", "shadcn/ui", "TanStack Query", "Zustand"]
  data:
    relational: ["PostgreSQL 16+", "Supabase"]
    cache_queue: ["Redis", "BullMQ"]
    analytical: ["DuckDB", "ClickHouse"]
    object_store: ["S3 / R2 / Supabase Storage"]
    vector: ["pgvector", "Qdrant"]
  ml_ai:
    foundation_models: ["Anthropic Claude (Opus/Sonnet/Haiku)", "OpenAI GPT-4o", "Gemini"]
    open_weights: ["Llama 3.x", "Qwen 2.5", "Mistral"]
    tooling: ["LangChain", "LlamaIndex", "Instructor", "Pydantic-AI"]
    eval: ["Promptfoo", "Langfuse", "Phoenix"]
  infra:
    compute: ["Vercel", "AWS (ECS/Lambda)", "Cloudflare Workers", "Fly.io"]
    db_hosting: ["Supabase", "Neon", "PlanetScale"]
    cdn_edge: ["Cloudflare", "Vercel Edge"]
  observability:
    tracing: ["OpenTelemetry", "Sentry"]
    logs: ["Axiom", "Datadog", "Better Stack"]
    apm: ["Grafana Cloud", "Sentry Performance"]

# Standards (loaded into knowledge-base on bootstrap)
standards:
  code_quality:
    - "Strict TypeScript (no `any`, no implicit `any`, strictNullChecks)"
    - "Python: ruff + mypy strict mode"
    - "ESLint + Prettier configured; pre-commit hooks active"
    - "All public APIs documented in code + OpenAPI when HTTP-exposed"
  testing:
    - "Test pyramid: unit ≥ 60%, integration ≥ 30%, E2E ≥ 10% of test count"
    - "Coverage minimum: 80% for new code, 70% project-wide"
    - "All bug fixes require a failing test first (TDD for regressions)"
    - "Playwright for E2E with visual regression"
  ai_specific:
    - "Every LLM call has temperature + max_tokens documented"
    - "Prompt versioning: every production prompt has an ID + version + changelog"
    - "Eval suite per AI feature: minimum 20 examples with known-good outputs"
    - "Bias & safety checks per §31.4 quarterly"
    - "Human-in-loop for any AI decision flagged 'critical' (§31.2)"
  security:
    - "OWASP Top 10 verified at Gate A2"
    - "Secrets only in .firm/secrets.yaml or env, never committed"
    - "Dependencies scanned daily (Dependabot / Renovate)"
    - "Pen-test annually (per Audit Level)"
  dsgvo:
    - "Privacy-by-design: minimize data collection by default"
    - "Right to access, rectification, erasure, portability implemented per product"
    - "Consent banner respects PECR + DSGVO"
    - "Sub-processors listed publicly with AVV in place"
