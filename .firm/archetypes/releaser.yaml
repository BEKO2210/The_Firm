archetype: "releaser"
description: "Sole authority for production writes."
default_seniority_distribution:
  junior: 0.0
  mid:    0.0
  senior: 0.5
  lead:   0.5
  exec:   0.0
required_skills:
  - release-management
  - attention-to-detail
  - semver
  - change-management
  - integrity
mentorship_required_from: "senior"
review_pass_eligibility: ['self', 'peer', 'critic']
gate_authority: ['A1', 'A2', 'A3', 'B1', 'B2', 'B3', 'B6']
